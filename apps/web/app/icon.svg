<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- INA favicon: a jade disc with a gold ring and a Pandaren cloud scroll.
       Drawn, not taken from the game, so it can be used anywhere. -->
  <defs>
    <radialGradient id="jade" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#3aa882"/>
      <stop offset="0.55" stop-color="#1c5343"/>
      <stop offset="1" stop-color="#0a1512"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6b4"/>
      <stop offset="0.5" stop-color="#c8aa6e"/>
      <stop offset="1" stop-color="#6b552e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#jade)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000" stroke-width="1"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <!-- cloud scroll: two mirrored curls meeting at the centre -->
  <g fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round">
    <path d="M14 36 c4 -9 12 -9 15 -2 c2 5 -2 9 -6 7 c-3 -2 -1 -6 2 -5"/>
    <path d="M50 36 c-4 -9 -12 -9 -15 -2 c-2 5 2 9 6 7 c3 -2 1 -6 -2 -5"/>
  </g>
  <circle cx="32" cy="42" r="2.6" fill="url(#gold)"/>
</svg>
