# isnotalone.de -> INA Analytics on 127.0.0.1:3100
#
# HTTP only as installed; certbot --nginx (run by server-setup.sh) adds the
# TLS server block and the redirect, the same way the BauWerk vhosts got theirs.
server {
    listen 80;
    listen [::]:80;
    server_name isnotalone.de www.isnotalone.de;

    # Certificates and images are the biggest things that move; nothing here
    # uploads files.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
